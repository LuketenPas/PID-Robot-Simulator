<!DOCTYPE html>
<html>
<head>
    <title>PID Robot Simulator</title>

    <style>
        input[type="range"] {
            width: 800px;
            height: 20px;
        }

        label {
            font-size: 20px;
        }

        input[type="number"] {
            width: 90px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <canvas id="robotCanvas" width="1200" height="600" style="border:1px solid black; display:inline-block;"></canvas>
    <canvas id="graphCanvas" width="600" height="600" style="border:1px solid black; display:inline-block;"></canvas>

    <br>

    <label>kP: </label>
    <input type="number" id="kpValue" min="0" max="1" value="0.01" step="0.001">
    <input type="range" id="kpSlider" min="0" max="1" step="0.001" value="0.01">

    <br>

    <label>kI: </label>
    <input type="number" id="kiValue" min="0" max="0.01" value="0.0" step="0.00001">
    <input type="range" id="kiSlider" min="0" max="0.01" step="0.00001" value="0">

    <br>

    <label>kD: </label>
    <input type="number" id="kdValue" min="0" max="1.5" value="0.08" step="0.001">
    <input type="range" id="kdSlider" min="0" max="1.5" step="0.001" value="0.08">

    <script>
        var robotCanvas = document.getElementById("robotCanvas");
        var robotCtx = robotCanvas.getContext("2d");

        var graphCanvas = document.getElementById("graphCanvas");
        var graphCtx = graphCanvas.getContext("2d");

        // PID values
        var kP = 0.01;
        var kI = 0.0;
        var kD = 0.08;

        // Target position
        var targetX = 600;
        var targetY = 300;

        // Robot position
        var robotX = 0;
        var robotY = 0;

        // PID memory
        var previousErrorX = 0;
        var previousErrorY = 0;

        var integralX = 0;
        var integralY = 0;

        // Robot velocity
        var velocityX = 0;
        var velocityY = 0;

        // Graph variables
        var setpoint = 0;
        var valueHistory = [];

        var dirX = 0;
        var dirY = 0;

        var graphPaused = false;

        // Settling settings
        var errorTolerance = 2;
        var velocityTolerance = 0.05;

        // Graph settings
        var graphSpeed = 4;
        var graphZoom = 1.0;

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function resetPIDMemory() {
            previousErrorX = 0;
            previousErrorY = 0;

            integralX = 0;
            integralY = 0;

            velocityX = 0;
            velocityY = 0;
        }

        function setupPIDInput(numberId, sliderId, min, max, updateValue) {
            var numberInput = document.getElementById(numberId);
            var sliderInput = document.getElementById(sliderId);

            numberInput.addEventListener("input", function() {
                // Let people type unfinished decimals like ".", "0.", or ".08"
                if (
                    this.value === "" ||
                    this.value === "." ||
                    this.value === "0." ||
                    this.value === "-"
                ) {
                    return;
                }

                var parsed = parseFloat(this.value);

                if (!isNaN(parsed)) {
                    // While typing, update the PID value, but do not rewrite the box.
                    // Rewriting the box here is what caused decimals to auto-jump.
                    updateValue(parsed);
                }
            });

            numberInput.addEventListener("change", function() {
                var parsed = parseFloat(this.value);

                if (isNaN(parsed)) {
                    parsed = min;
                }

                parsed = clamp(parsed, min, max);

                updateValue(parsed);
                this.value = parsed;
                sliderInput.value = parsed;
            });

            sliderInput.addEventListener("input", function() {
                var parsed = parseFloat(this.value);

                if (!isNaN(parsed)) {
                    updateValue(parsed);
                    numberInput.value = parsed;
                }
            });
        }

        robotCanvas.addEventListener("click", function(event) {
            var rect = robotCanvas.getBoundingClientRect();

            targetX = event.clientX - rect.left;
            targetY = event.clientY - rect.top;

            var dx = targetX - robotX;
            var dy = targetY - robotY;

            setpoint = Math.sqrt(dx * dx + dy * dy);

            if (setpoint === 0) {
                return;
            }

            dirX = dx / setpoint;
            dirY = dy / setpoint;

            resetPIDMemory();

            valueHistory = [];
            graphPaused = false;
        });

        setupPIDInput("kpValue", "kpSlider", 0, 1, function(value) {
            kP = value;
        });

        setupPIDInput("kiValue", "kiSlider", 0, 0.01, function(value) {
            kI = value;
        });

        setupPIDInput("kdValue", "kdSlider", 0, 1.5, function(value) {
            kD = value;
        });

        function calculatePIDX() {
            var error = targetX - robotX;

            var maxIntegral = 200;

            integralX += error;
            integralX = clamp(integralX, -maxIntegral, maxIntegral);

            var derivative = error - previousErrorX;
            previousErrorX = error;

            return (kP * error) + (kI * integralX) + (kD * derivative);
        }

        function calculatePIDY() {
            var error = targetY - robotY;

            var maxIntegral = 200;

            integralY += error;
            integralY = clamp(integralY, -maxIntegral, maxIntegral);

            var derivative = error - previousErrorY;
            previousErrorY = error;

            return (kP * error) + (kI * integralY) + (kD * derivative);
        }

        function drawGraph() {
            var zeroY = 200;
            var legendY = graphCanvas.height - 70;

            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            // Draw zero-error / setpoint line
            graphCtx.beginPath();
            graphCtx.setLineDash([5, 5]);
            graphCtx.moveTo(0, zeroY);
            graphCtx.lineTo(graphCanvas.width, zeroY);
            graphCtx.strokeStyle = "cyan";
            graphCtx.stroke();
            graphCtx.setLineDash([]);

            // Draw error graph
            graphCtx.beginPath();

            for (var i = 0; i < valueHistory.length; i++) {
                var x = i * graphSpeed;

                var y = zeroY + (valueHistory[i] / setpoint) * (legendY - zeroY) * graphZoom;

                y = clamp(y, 0, legendY - 10);

                if (i === 0) {
                    graphCtx.moveTo(x, y);
                } else {
                    graphCtx.lineTo(x, y);
                }
            }

            graphCtx.strokeStyle = "green";
            graphCtx.stroke();

            // Divider between graph and key
            graphCtx.beginPath();
            graphCtx.strokeStyle = "black";
            graphCtx.moveTo(0, legendY);
            graphCtx.lineTo(graphCanvas.width, legendY);
            graphCtx.stroke();

            // Graph key
            graphCtx.font = "18px Arial";
            graphCtx.fillStyle = "black";
            graphCtx.fillText("Graph Key", 20, legendY + 25);

            graphCtx.beginPath();
            graphCtx.strokeStyle = "green";
            graphCtx.moveTo(150, legendY + 20);
            graphCtx.lineTo(200, legendY + 20);
            graphCtx.stroke();

            graphCtx.fillStyle = "black";
            graphCtx.fillText("Error", 210, legendY + 26);

            graphCtx.beginPath();
            graphCtx.setLineDash([5, 5]);
            graphCtx.strokeStyle = "cyan";
            graphCtx.moveTo(300, legendY + 20);
            graphCtx.lineTo(350, legendY + 20);
            graphCtx.stroke();
            graphCtx.setLineDash([]);

            graphCtx.fillStyle = "black";
            graphCtx.fillText("Setpoint / zero error", 360, legendY + 26);
        }

        function update() {
            robotCtx.clearRect(0, 0, robotCanvas.width, robotCanvas.height);

            // Draw target
            robotCtx.beginPath();
            robotCtx.arc(targetX, targetY, 10, 0, Math.PI * 2);
            robotCtx.fillStyle = "red";
            robotCtx.fill();

            // PID controls velocity
            velocityX += calculatePIDX();
            velocityY += calculatePIDY();

            // Friction / damping
            velocityX *= 0.8;
            velocityY *= 0.8;

            // Move robot
            robotX += velocityX;
            robotY += velocityY;

            // Draw robot
            robotCtx.fillStyle = "blue";
            robotCtx.fillRect(robotX - 20, robotY - 20, 40, 40);

            // Error calculations
            var errorX = targetX - robotX;
            var errorY = targetY - robotY;

            var distanceError = Math.sqrt(errorX * errorX + errorY * errorY);
            var velocityMagnitude = Math.sqrt(velocityX * velocityX + velocityY * velocityY);

            var currentValue = errorX * dirX + errorY * dirY;

            if (!graphPaused && setpoint !== 0) {
                valueHistory.push(currentValue);

                if (valueHistory.length > graphCanvas.width / graphSpeed) {
                    valueHistory.shift();
                }

                // Stop graph only when robot is close AND basically stopped
                if (distanceError < errorTolerance && velocityMagnitude < velocityTolerance) {
                    graphPaused = true;
                }
            }

            drawGraph();

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
